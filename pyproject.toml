[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-data-analysis-agent"
version = "0.1.0"
description = "Human-in-the-loop data analysis agent built with LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2,<2",
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
  "openpyxl>=3.1,<4",
  "pyarrow>=14,<21",
  "scipy>=1.10,<2",
  "statsmodels>=0.14,<1",
  "pandera[pandas]>=0.20,<1",
  "pydantic>=2.7,<3",
  "plotly>=5.20,<7",
  "streamlit>=1.36,<2",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "grandalf>=0.8,<1",
  "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
data-agent = "data_agent.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/data_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/data_agent/main.py" = ["B008"]
